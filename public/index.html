<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Real Estate Geotag Map | ផែនទីអចលនទ្រព្យ</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Inter & Kantumruy Pro for Khmer typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- App Container -->
  <div id="app-container">
    
    <!-- Top Navigation & Search Bar -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon"><i class="fa-solid fa-map-location-dot"></i></div>
          <div class="brand-text">
            <h1>ផែនទីអចលនទ្រព្យ</h1>
            <span class="brand-subtitle">Real Estate Geotag Pro</span>
          </div>
        </div>
        <div class="header-actions">
          <span id="property-count-badge" class="badge">0 ទីតាំង</span>
          <button id="btn-add-property" class="icon-btn add-btn" title="បន្ថែមអចលនទ្រព្យថ្មី (Add Property)">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button id="btn-toggle-list" class="icon-btn" title="បើក/បិទ បញ្ជី (Toggle List)">
            <i class="fa-solid fa-list-ul"></i>
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="ស្វែងរកតាមឈ្មោះ តម្លៃ ឬទីតាំង..." />
          <button id="clear-search" class="clear-btn" style="display: none;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="category-filter-scroll">
        <button class="filter-pill active" data-type="all">ទាំងអស់ (All)</button>
        <button class="filter-pill" data-type="villa">🏠 ផ្ទះ/វីឡា</button>
        <button class="filter-pill" data-type="condo">🏢 ខុនដូ</button>
        <button class="filter-pill" data-type="land">🌾 ដីឡូត៍</button>
        <button class="filter-pill" data-type="shophouse">🏪 ផ្ទះអាជីវកម្ម</button>
      </div>
    </header>

    <!-- Map Canvas Container -->
    <main id="map-wrapper">
      <div id="map"></div>

      <!-- Floating Map Controls Overlay -->
      <div class="map-floating-controls">
        <button id="btn-locate-me" class="float-btn" title="ទីតាំងបច្ចុប្បន្នរបស់ខ្ញុំ (My Location)">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
        <button id="btn-layer-switch" class="float-btn" title="ប្តូរផ្កាយរណប/ផ្លូវ (Satellite/Street)">
          <i class="fa-solid fa-layer-group"></i>
        </button>
        <button id="btn-refresh" class="float-btn" title="ផ្ទុកទិន្នន័យឡើងវិញ (Refresh)">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <!-- Quick Stats Card on Map -->
      <div id="quick-stats-card" class="quick-stats-card">
        <div class="stat-item">
          <i class="fa-solid fa-house-circle-check"></i>
          <div>
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-lbl">បានកត់ត្រា</div>
          </div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <i class="fa-solid fa-satellite-dish"></i>
          <div>
            <div class="stat-val" id="stat-active-layer">Street</div>
            <div class="stat-lbl">ទម្រង់ផែនទី</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Slide-up Property List Drawer -->
    <div id="properties-drawer" class="drawer">
      <div class="drawer-handle-bar" id="drawer-handle">
        <div class="drawer-pill"></div>
      </div>
      <div class="drawer-header">
        <h3><i class="fa-solid fa-city"></i> បញ្ជីអចលនទ្រព្យដែលបានកត់ត្រា</h3>
        <button id="btn-close-drawer" class="close-drawer-btn">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>
      <div id="properties-list" class="properties-list">
        <!-- Dynamic property items inserted here via JS -->
      </div>
    </div>

    <!-- Property Details Inspection Modal -->
    <div id="details-modal" class="modal">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close-btn">&times;</button>
        <div class="modal-image-container">
          <img id="modal-image" src="" alt="Property" />
          <div class="modal-type-badge" id="modal-type-badge">🏠 ផ្ទះ/វីឡា</div>
          <div class="modal-date-tag" id="modal-date-tag"></div>
        </div>
        <div class="modal-body">
          <div class="modal-title-row">
            <h2 id="modal-title" class="modal-title">Property Title</h2>
            <div id="modal-price" class="modal-price"></div>
          </div>
          <p id="modal-notes" class="modal-notes"></p>
          
          <div class="coords-box">
            <i class="fa-solid fa-location-dot"></i>
            <span id="modal-coords">11.5564, 104.9282</span>
            <button id="btn-copy-coords" class="copy-coords-btn" title="ចម្លងកូអរដោនេ"><i class="fa-regular fa-copy"></i></button>
          </div>

          <!-- Direct Navigation Links -->
          <div class="action-buttons-grid">
            <a id="btn-google-maps" href="#" target="_blank" class="nav-btn google">
              <i class="fa-brands fa-google"></i> Google Maps
            </a>
            <a id="btn-waze" href="#" target="_blank" class="nav-btn waze">
              <i class="fa-brands fa-waze"></i> Waze
            </a>
            <a id="btn-apple-maps" href="#" target="_blank" class="nav-btn apple">
              <i class="fa-brands fa-apple"></i> Apple Maps
            </a>
          </div>

          <!-- Share & Delete Actions -->
          <div class="modal-actions-footer">
            <button id="btn-share-property" class="btn-share">
              <i class="fa-solid fa-share-nodes"></i> ចែករំលែក (Share)
            </button>
            <button id="btn-delete-property" class="btn-danger">
              <i class="fa-solid fa-trash-can"></i> លុប (Delete)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Manual Add Property Modal -->
    <div id="add-modal" class="modal">
      <div class="modal-backdrop" id="add-modal-backdrop"></div>
      <div class="modal-content add-modal-content">
        <button class="modal-close" id="add-modal-close-btn">&times;</button>
        <div class="add-modal-header">
          <h3><i class="fa-solid fa-location-crosshairs"></i> បន្ថែមអចលនទ្រព្យថ្មី</h3>
          <p>កត់ត្រាទីតាំងដោយផ្ទាល់ពីក្នុង Mini App</p>
        </div>
        <form id="add-property-form" class="add-form">
          <div class="form-group">
            <label>ឈ្មោះ ឬចំណងជើងអចលនទ្រព្យ *</label>
            <input type="text" id="add-title" placeholder="ឧ. ផ្ទះវីឡា ផ្លូវ 2004..." required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>ប្រភេទអចលនទ្រព្យ</label>
              <select id="add-type">
                <option value="villa">🏠 ផ្ទះ/វីឡា</option>
                <option value="condo">🏢 ខុនដូ</option>
                <option value="land">🌾 ដីឡូត៍</option>
                <option value="shophouse">🏪 ផ្ទះអាជីវកម្ម</option>
              </select>
            </div>
            <div class="form-group">
              <label>តម្លៃ (ជម្រើស)</label>
              <input type="text" id="add-price" placeholder="ឧ. $120,000" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Latitude *</label>
              <input type="number" step="any" id="add-lat" placeholder="11.5564" required />
            </div>
            <div class="form-group">
              <label>Longitude *</label>
              <input type="number" step="any" id="add-lng" placeholder="104.9282" required />
            </div>
          </div>

          <button type="button" id="btn-use-my-gps" class="btn-gps-autofill">
            <i class="fa-solid fa-location-arrow"></i> ប្រើទីតាំង GPS បច្ចុប្បន្នរបស់ខ្ញុំ
          </button>

          <div class="form-group">
            <label>រូបភាព URL (ជម្រើស)</label>
            <input type="url" id="add-image-url" placeholder="https://..." />
          </div>

          <div class="form-group">
            <label>កត់ចំណាំបន្ថែម</label>
            <textarea id="add-notes" rows="2" placeholder="ទំហំដី បន្ទប់គេង ព័ត៌មានលម្អិត..."></textarea>
          </div>

          <button type="submit" class="btn-submit-add">
            <i class="fa-solid fa-floppy-disk"></i> រក្សាទុកអចលនទ្រព្យ
          </button>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

  </div>

  <!-- Leaflet.js JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
